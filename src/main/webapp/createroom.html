<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verposter - Raum erstellen</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 text-center text-slate-100 sm:py-14">
<main class="mx-auto max-w-xl rounded-3xl border border-slate-700 bg-slate-900 p-5 shadow-xl sm:p-8">

<h1 class="mb-6 text-4xl font-black tracking-tight text-lime-300 sm:text-5xl">VERPOSTER</h1>

<h2>Erstelle einen Raum</h2>

<p>
<form id = "create-room" action = "api/rooms/" method = "post">

    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" maxlength="20"required>

    </p>

    <button> Erstellen </button>
</form>

</main>

<script>
    const form = document.getElementById("create-room");
    form.addEventListener("submit",async (event) => {event.preventDefault()

    const resp = await fetch("api/rooms/", {
        method:"POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: form.elements.name.value
        })
    });
    if (resp.ok){
        window.location.href = "lobby";
    } else{
        alert("Der Raum konnte nicht erstellt werden");
    }
    });
</script>
</body>
</html>
