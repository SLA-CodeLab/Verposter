<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verposter</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 text-center text-slate-100 sm:py-14">
<main class="mx-auto max-w-xl rounded-3xl border border-slate-700 bg-slate-900 p-5 shadow-xl sm:p-8">


<h1 class="mb-6 text-4xl font-black tracking-tight text-lime-300 sm:text-5xl">VERPOSTER</h1>


<p>Warten auf die anderen Spieler </p>
<table>
    <thead>
    <tr>
        <th>Nr</th>
        <th>Spieler</th>
        <th>Bereit</th>
    </tr>
    </thead>

    <tbody id="users-table">

    </tbody>
</table>

<p>Themen</p>
<table>
    <thead>
    <tr>
        <th>Nr</th>
        <th>Thema</th>
    </tr>
    </thead>

    <tbody id="topics-table">

    </tbody>
</table>

<p><button type="button" id="ready-button">Bereit</button>&nbsp;&nbsp;&nbsp;&nbsp;<button type="button" id="leave-button">Verlassen</button></p>

</main>

<script>
    const ROOM_ID = new URLSearchParams(window.location.search).get("roomId");

    async function getMembers(){
        const resp = await fetch(`api/rooms/${ROOM_ID}/members`);
        const members = await resp.json();

        const table = document.getElementById("users-table");
        table.innerHTML = "";
        let index = 1;
        for(const member of members){
            const row = document.createElement("tr");
            for (const value of [index++, member.name, member.ready ? "✓" : "✗"]) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.append(cell);
            }
            table.append(row);
        }

        if (members.length >= 3 && members.every(m => m.ready)) {
            window.location.href = `game.html?roomId=${ROOM_ID}`;
        }
    }

    document.getElementById("ready-button").addEventListener("click", async function () {
        const resp = await fetch(`api/rooms/${ROOM_ID}/members/ready`, {
            method: "PATCH"
        });
        if (!resp.ok) {
            return;
        }
        await getMembers();
    });

    document.getElementById("leave-button").addEventListener("click", async function () {
        const resp = await fetch(`api/rooms/${ROOM_ID}/members/leave`, {
            method: "DELETE"
        });
        if (!resp.ok) {
            return;
        }
        window.location.href = "lobby";
    });

    async function getTopics(){
        const resp = await fetch(`api/topics`);
        const topics = await resp.json();

        const table = document.getElementById("topics-table");
        table.innerHTML = "";
        let index = 1;
        for(const topic of topics){
            const row = document.createElement("tr");
            for (const value of [index++, topic.name]) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.append(cell);
            }
            table.append(row);
        }
    }

    getMembers();
    getTopics();
    setInterval(getMembers, 2000);
</script>
</body>
</html>
