<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verposter - Anmelden</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen bg-slate-950 px-4 py-8 text-center text-slate-100 sm:py-14">
<main class="mx-auto max-w-xl rounded-3xl border border-slate-700 bg-slate-900 p-5 shadow-xl sm:p-8">

<h1 class="mb-6 text-4xl font-black tracking-tight text-lime-300 sm:text-5xl">VERPOSTER</h1>

<h2>Anmelden</h2>
<form id="login-form" action = "login" method = "post">
    <label for="username">Benutzername</label><br>
    <input type="text" id="username" name="username" maxlength="20"required><br>

    <label for="password">Passwort</label><br>
    <input type="password" id="password" name="password" maxlength="20" required><br><br>

    <button> Anmelden </button>&nbsp;&nbsp;
    <button type="button" onclick="location.href='register'"> Zur Registrierung </button>
</form>

</main>

<script>
    const form = document.getElementById("login-form");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const resp = await fetch("login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                name: username,
                password: password
            })
        });

        if (resp.ok) {
            window.location.href = "lobby";
        } else if (resp.status === 401) {
            alert("Falscher Benutzername oder Passwort");
        } else {
            alert("Server Fehler");
        }
    });
</script>
</body>
</html>
